name: Release

# Publica uma versão nova quando ela é marcada (passo a passo em docs/RELEASE.md):
#   1. suba a versão em Cargo.toml (workspace) e em src-tauri/tauri.conf.json
#   2. escreva o que mudou em release-notes.md
#   3. git tag v0.2.0 && git push origin v0.2.0
#
# O código é privado: o instalador e o arquivo de versões (latest.json) vão para o
# repositório público do site, que só tem a página e os downloads. O app instalado
# procura atualizações nesse latest.json e só aceita instaladores assinados com a
# nossa chave de atualização.
#
# Segredos do repositório (Settings > Secrets and variables > Actions):
#   SITE_RELEASES_TOKEN                token com escrita em "contents" só no repositório do site
#   TAURI_SIGNING_PRIVATE_KEY          chave privada de atualização (conteúdo do updater.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD senha dessa chave
# Variável (não secreta):
#   GREAT_COTW_LICENSE_SERVER          endereço https do servidor de licenças
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    env:
      SITE_REPO: OtavioProcopio/great-cotw-one-site
    steps:
      - uses: actions/checkout@v4
      - name: A tag bate com a versão do app
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $conf) { throw "A tag v$tag não bate com a versão $conf do tauri.conf.json" }
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $cargo) { throw "A tag v$tag não bate com a versão $cargo do Cargo.toml" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Instalador (NSIS) assinado para atualização automática
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GREAT_COTW_LICENSE_SERVER: ${{ vars.GREAT_COTW_LICENSE_SERVER }}
        run: ui/node_modules/.bin/tauri build --config src-tauri/tauri.release.conf.json
      - name: Nome sem espaços e arquivo de versões
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $exe = Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          $name = "great-cotw-one_${version}_x64-setup.exe"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe.FullName "out/$name"
          Copy-Item "$($exe.FullName).sig" "out/$name.sig"
          $notes = if (Test-Path release-notes.md) { (Get-Content release-notes.md -Raw).Trim() } else { "Versão $version do Great COTW One." }
          $latest = [ordered]@{
            version   = $version
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content "out/$name.sig" -Raw).Trim()
                url       = "https://github.com/$env:SITE_REPO/releases/download/$tag/$name"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content out/latest.json -Encoding utf8NoBOM
          Get-Content out/latest.json
      - name: Publicar no repositório do site
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.SITE_REPO }}
          token: ${{ secrets.SITE_RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Great COTW One ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            out/*.exe
            out/*.sig
            out/latest.json
          generate_release_notes: false
