name: Release

# Publica o instalador para download quando uma versão é marcada:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Instalador (NSIS)
        run: ui/node_modules/.bin/tauri build
      # O código é privado: o instalador vai para o repositório público do site,
      # que só tem a página e os downloads. Precisa do segredo SITE_RELEASES_TOKEN
      # (token do GitHub com permissão de escrita em "contents" só nesse repositório).
      - name: Publicar o instalador no repositório do site
        uses: softprops/action-gh-release@v2
        with:
          repository: OtavioProcopio/great-cotw-one-site
          token: ${{ secrets.SITE_RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Great COTW One ${{ github.ref_name }}
          files: target/release/bundle/nsis/*.exe
          generate_release_notes: false
