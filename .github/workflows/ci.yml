name: CI

on:
  push:
    branches: [main]
  pull_request:

# O CI só lê o repositório; nada aqui precisa de escrita.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Sem debuginfo: o link no Windows fica bem mais rápido e o cache bem menor.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # O build do Tauri precisa do frontend compilado em ui/dist.
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          cache-on-failure: true
      - name: Format
        run: cargo fmt-check
      - name: Lint
        run: cargo lint

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # O build do Tauri precisa do frontend compilado em ui/dist.
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-on-failure: true
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Roda os testes e mede a cobertura de uma vez. Os testes que usam saves e o
      # jogo reais são ignorados na CI (medido sem eles: ~74%).
      # Subir este mínimo conforme entrarem testes com dados sintéticos.
      - name: Tests e cobertura (mínimo de 70% das linhas)
        run: cargo llvm-cov --workspace --fail-under-lines 70 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Tests e cobertura (limites em vite.config.ts)
        run: npm run coverage

  # Dependências com falha de segurança conhecida derrubam o CI.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Rust (RustSec)
        run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - name: Interface (só o que vai no app)
        run: npm --prefix ui audit --omit=dev --audit-level=high
