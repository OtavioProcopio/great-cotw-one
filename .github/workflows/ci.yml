name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # O build do Tauri (cargo lint/test) precisa do frontend compilado em ui/dist.
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt-check
      - name: Lint
        run: cargo lint
      - name: Tests (os que usam saves e o jogo reais são ignorados sem eles)
        run: cargo test --workspace
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage (mínimo de 80% das linhas)
        run: cargo llvm-cov --workspace --fail-under-lines 80 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Tests e cobertura (limites em vite.config.ts)
        run: npm run coverage

  installer:
    needs: [rust, ui]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Instalador (NSIS)
        run: ui/node_modules/.bin/tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: target/release/bundle/nsis/*.exe
