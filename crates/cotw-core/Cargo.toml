[package]
name = "cotw-core"
description = "Descoberta de saves e do jogo, processo do jogo, backup, histórico e gravação segura"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cotw-formats = { path = "../cotw-formats" }
dirs = "6.0.0"
ed25519-dalek = "2.2.0"
jpeg-encoder = "0.6.1"
png = "0.18.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
cotw-formats = { path = "../cotw-formats" }
flate2 = "1.1.10"
tempfile = "3.27.0"
